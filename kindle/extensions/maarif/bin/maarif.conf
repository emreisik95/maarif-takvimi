description "Maarif dashboard lock-screen scheduler"

start on started lab126_gui
stop on stopping lab126_gui

respawn
respawn limit 5 60

script
    [ -f /mnt/base-us/extensions/maarif/enabled ] || exit 0
    export MAARIF_BASE=/mnt/us/extensions/maarif
    exec /bin/sh /mnt/base-us/extensions/maarif/bin/daemon.sh
end script
